<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
</head>
<body>
     <script type="module" src="scripts/main.js"></script>

    <div>
        <form>
            <!--Inputs-->
            <label>Codigo</label>
                <input type="number" id="txtCode" placeholder="Codigo del producto">
        
            <label>Nombre</label>
                <input type="text" id="txtNom" placeholder="Nombre del producto">
           
            <label>Cantidad</label>
                <input type="number" id="txtCan" placeholder="Cantidad del producto">
           
            <label>Costo</label>
                <input type="number" id="txtCost" placeholder="Costo del producto">
          
            <label>Posicion</label>
                <input type="number" id="txtPos" placeholder="Posicion del Producto">
            <br>
            <br>
            <!---Buttons-->
         
                <button id="addProd">
                    Agregar Producto
                </button>

                <button id="addProdIn">
                    Agregar Producto Al Inicio
                </button>

                <button id="lisInv">
                    Listar Inventario
                </button>
                
                <button id="delProd">
                    Eliminar Producto 
                </button>
         
                 <button id="buscProd">
                    Buscar Producto
                </button>
          
                 <button id="extProd">
                    Extraer Primer Producto
                </button>
           
                <button id="insProd">
                    Insertar Producto
                </button>

                <button id="invInver">
                    Listar Inventario Inverso
                </button>
        </form>
    </div>

    <br>
    <br>
    <br>
    <div id="output"></div>

</body>
</html>
